name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-13
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package
        shell: bash
        run: |
          packaging/package.sh "${{ matrix.rid }}" "${GITHUB_REF_NAME#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/ImmoCad-*
          if-no-files-found: error
